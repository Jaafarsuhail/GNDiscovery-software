name: Release source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check data exclusions, manifest and model identity
        run: python qa/verify_distribution.py
      - name: Compile source code
        run: python -m compileall -q app_core streamlit_app GNRetain_Source_Feature_Engine scripts qa
